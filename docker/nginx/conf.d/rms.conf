# Docker embedded DNS — re-resolve service names so rebuilds/recreates
# do not leave nginx pointing at stale container IPs (502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    location /ai-health {
        access_log off;
        set $upstream_ai ai-service;
        proxy_pass http://$upstream_ai:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        set $upstream_api api;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$upstream_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_web web;
        proxy_pass http://$upstream_web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
